<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search results at LittleBloom — find the perfect kids clothing, gift sets and school wear.">
  <meta name="keywords" content="search kids clothing, baby clothes search">
  <meta name="author" content="LittleBloom">
  <title>Search — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Search — LittleBloom">
  <meta property="og:description" content="Search the LittleBloom collection.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="search">

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <!-- Navbar (injected by assets/js/navbar.js) -->
  <div id="navbar-container"></div>

  <main>

    <!-- ============ PAGE BANNER ============ -->
    <section class="page-banner">
      <div class="animated-bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
      </div>
      <div class="container position-relative" style="z-index:2">
        <span class="hero-badge"><i class="bi bi-search"></i> Search the Shop</span>
        <h1 class="mt-3">Find Your Favourite</h1>
        <p>Search by name, category or style — like "dress", "uniform" or "romper".</p>
        <div class="mx-auto" style="max-width:560px">
          <form class="search-hero-form" id="searchHeroForm" role="search">
            <div class="input-group input-group-lg">
              <input type="search" class="form-control" id="searchQueryInput" placeholder="Search products…" aria-label="Search products">
              <button class="btn btn-brand px-4" type="submit"><i class="bi bi-search me-1"></i>Search</button>
            </div>
          </form>
        </div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Search</li>
          </ol>
        </nav>
      </div>
    </section>

    <!-- ============ SHOP CONTENT ============ -->
    <section class="section">
      <div class="container">
        <div class="row g-4">

          <!-- Sidebar filters -->
          <aside class="col-lg-3 shop-sidebar" aria-label="Product filters">
            <div class="sidebar-inner">
              <div class="d-flex align-items-center justify-content-between mb-3 d-lg-none">
                <h5 class="mb-0 font-heading">Filters</h5>
                <button type="button" class="icon-btn" data-filter-close aria-label="Close filters"><i class="bi bi-x-lg"></i></button>
              </div>

              <div id="filterPanel">
                <!-- Category -->
                <div class="filter-widget">
                  <h6>Category <button type="button" class="clear-f js-reset-filters">Reset</button></h6>
                  <ul class="filter-list">
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="tops"> Tops</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="bottoms"> Bottoms</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="dresses"> Dresses</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="tshirts"> T-Shirts</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="shirts"> Shirts</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="shorts"> Shorts</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="pants"> Pants</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="sets"> Sets</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="sleepwear"> Sleepwear</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="party"> Party Wear</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="school"> School Wear</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="category" value="accessories"> Accessories</label></li>
                  </ul>
                </div>

                <!-- Gender -->
                <div class="filter-widget">
                  <h6>Gender</h6>
                  <ul class="filter-list">
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="gender" value="boys"> Boys</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="gender" value="girls"> Girls</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="gender" value="unisex"> Unisex</label></li>
                  </ul>
                </div>

                <!-- Size -->
                <div class="filter-widget">
                  <h6>Size</h6>
                  <ul class="filter-list">
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="0-3m"> 0–3 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="3-6m"> 3–6 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="6-9m"> 6–9 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="9-12m"> 9–12 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="12-18m"> 12–18 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="18-24m"> 18–24 months</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="2Y"> 2 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="3Y"> 3 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="4Y"> 4 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="5Y"> 5 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="6Y"> 6 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="7Y"> 7 years</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="size" value="8Y"> 8 years</label></li>
                  </ul>
                </div>

                <!-- Price -->
                <div class="filter-widget">
                  <h6>Price</h6>
                  <div class="range-slider">
                    <div class="range-fill" id="rangeFill"></div>
                    <input type="range" id="priceMin" min="0" max="200" step="5" value="0" aria-label="Minimum price">
                    <input type="range" id="priceMax" min="0" max="200" step="5" value="200" aria-label="Maximum price">
                  </div>
                  <div class="range-output"><span id="rangeOutput">$0 – $200</span></div>
                </div>

                <!-- Availability -->
                <div class="filter-widget">
                  <h6>Availability</h6>
                  <ul class="filter-list">
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="availability" value="instock" checked> In Stock</label></li>
                    <li><label><input type="checkbox" class="form-check-input f-check" data-filter="availability" value="onsale"> On Sale</label></li>
                  </ul>
                </div>

                <div class="d-grid gap-2">
                  <button type="button" class="btn btn-outline-brand" id="resetFiltersBtn"><i class="bi bi-arrow-counterclockwise me-1"></i>Clear All Filters</button>
                </div>
              </div>
            </div>
          </aside>

          <!-- Product grid -->
          <div class="col-lg-9">
            <!-- Toolbar -->
            <div class="shop-toolbar mb-4">
              <button type="button" class="btn btn-soft btn-sm filter-toggle-btn" id="filterToggle"><i class="bi bi-sliders me-1"></i>Filters</button>
              <div class="result-count"><i class="bi bi-search me-1 text-brand"></i><span id="resultCount">0</span> results</div>
              <div class="d-flex align-items-center gap-2 ms-auto flex-wrap">
                <div class="input-group input-group-sm" style="max-width:200px">
                  <input type="search" id="shopSearch" class="form-control" placeholder="Refine results…" aria-label="Refine search">
                  <span class="input-group-text bg-transparent border-0"><i class="bi bi-search text-muted"></i></span>
                </div>
                <select id="sortSelect" class="form-select form-select-sm" aria-label="Sort products" style="width:auto">
                  <option value="featured">Sort: Featured</option>
                  <option value="newest">Newest</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                  <option value="rating">Best Rated</option>
                  <option value="popular">Most Popular</option>
                </select>
              </div>
            </div>
            <p class="text-muted mb-3" id="resultNote" aria-live="polite"></p>

            <div class="product-grid grid-3" id="shopGrid"></div>

            <!-- Pagination -->
            <div class="mt-5" id="paginationWrap"></div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer (injected by assets/js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/filters.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var heroForm = document.getElementById("searchHeroForm");
      if (heroForm) {
        heroForm.addEventListener("submit", function (e) {
          e.preventDefault();
          var q = document.getElementById("searchQueryInput").value.trim();
          if (q) {
            window.location.href = "search.html?q=" + encodeURIComponent(q);
          }
        });
      }
    });
  </script>
</body>
</html>
