<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create your LittleBloom account — track orders, save favourites and earn Bloom Points.">
  <meta name="keywords" content="register, sign up, create account">
  <meta name="author" content="LittleBloom">
  <title>Create Account — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Account — LittleBloom">
  <meta property="og:description" content="Join the LittleBloom family.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Theme + RTL / LTR toggles -->
  <div style="position:fixed;top:1rem;right:1rem;z-index:1050;display:flex;gap:.5rem;direction:ltr">
    <button type="button" class="theme-toggle icon-btn" aria-label="Toggle dark / light mode" title="Toggle dark / light mode"><i class="bi bi-moon-stars"></i><i class="bi bi-sun"></i></button>
    <button type="button" class="rtl-toggle icon-btn" aria-label="Toggle RTL / LTR layout" title="Toggle RTL / LTR"><i class="bi bi-text-right"></i></button>
  </div>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <main>

    <!-- ============ AUTH CARD ============ -->
    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-7 col-xl-6">
            <div class="summary-card auth-card" style="position:static">
              <div class="text-center mb-4">
                <a href="index.html" class="auth-brand-link d-inline-flex align-items-center gap-2 mb-3 text-decoration-none" aria-label="LittleBloom Home" title="Back to LittleBloom Home">
                  <span class="brand-logo-wrap">
                    <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">
                      <defs>
                        <linearGradient id="lbRegLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FF9E80"/>
                          <stop offset="50%" stop-color="#FF6F61"/>
                          <stop offset="100%" stop-color="#F4511E"/>
                        </linearGradient>
                        <linearGradient id="lbRegPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FFFFFF"/>
                          <stop offset="100%" stop-color="#FFF3E0"/>
                        </linearGradient>
                        <linearGradient id="lbRegCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FFE082"/>
                          <stop offset="100%" stop-color="#FFB300"/>
                        </linearGradient>
                        <filter id="lbRegLogoGlow" x="-10%" y="-10%" width="120%" height="120%">
                          <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#F4511E" flood-opacity="0.3"/>
                        </filter>
                      </defs>
                      <rect x="3" y="3" width="58" height="58" rx="18" ry="18" fill="url(#lbRegLogoGrad)" filter="url(#lbRegLogoGlow)"/>
                      <path d="M 6 22 C 6 12, 12 6, 22 6 L 42 6 C 28 10, 10 21, 6 42 Z" fill="#FFFFFF" opacity="0.18"/>
                      <g fill="url(#lbRegPetalGrad)">
                        <ellipse cx="32" cy="21.5" rx="6.5" ry="8.5"/>
                        <ellipse cx="32" cy="42.5" rx="6.5" ry="8.5"/>
                        <ellipse cx="21.5" cy="32" rx="8.5" ry="6.5"/>
                        <ellipse cx="42.5" cy="32" rx="8.5" ry="6.5"/>
                        <ellipse cx="24.5" cy="24.5" rx="5.5" ry="7" transform="rotate(-45 24.5 24.5)" opacity="0.95"/>
                        <ellipse cx="39.5" cy="24.5" rx="5.5" ry="7" transform="rotate(45 39.5 24.5)" opacity="0.95"/>
                        <ellipse cx="24.5" cy="39.5" rx="5.5" ry="7" transform="rotate(45 24.5 39.5)" opacity="0.95"/>
                        <ellipse cx="39.5" cy="39.5" rx="5.5" ry="7" transform="rotate(-45 39.5 39.5)" opacity="0.95"/>
                      </g>
                      <circle cx="32" cy="32" r="8.5" fill="url(#lbRegCenterGrad)"/>
                      <path d="M 32 35.8 C 32 35.8 28.2 33.3 28.2 31.1 C 28.2 29.6 29.4 28.6 30.7 28.6 C 31.4 28.6 31.8 28.9 32 29.3 C 32.2 28.9 32.6 28.6 33.3 28.6 C 34.6 28.6 35.8 29.6 35.8 31.1 C 35.8 33.3 32 35.8 32 35.8 Z" fill="#E64A19"/>
                      <path d="M 48 13 Q 48 17 52 17 Q 48 17 48 21 Q 48 17 44 17 Q 48 17 48 13 Z" fill="#FFFFFF" opacity="0.9"/>
                    </svg>
                  </span>
                  <span class="brand-name fs-4"><span class="brand-name-dark">Little</span><span class="brand-name-coral">Bloom</span></span>
                </a>
                <h2 class="font-heading fw-bold mb-1 fs-3">Create Your Account</h2>
                <p class="text-muted small mb-0">Join the LittleBloom family to unlock exclusive rewards &amp; perks.</p>
              </div>

              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-md-6 form-field">
                    <label for="regName" class="form-label">Full Name</label>
                    <div class="input-group">
                      <span class="input-group-text bg-transparent"><i class="bi bi-person text-muted"></i></span>
                      <input type="text" class="form-control" id="regName" placeholder="Jane Doe" required>
                    </div>
                    <div class="error-msg"></div>
                  </div>
                  <div class="col-md-6 form-field">
                    <label for="regEmail" class="form-label">Email Address</label>
                    <div class="input-group">
                      <span class="input-group-text bg-transparent"><i class="bi bi-envelope text-muted"></i></span>
                      <input type="email" class="form-control" id="regEmail" placeholder="you@example.com" required>
                    </div>
                    <div class="error-msg"></div>
                  </div>
                  <div class="col-md-6 form-field">
                    <label for="regPass" class="form-label">Password</label>
                    <div class="input-group">
                      <span class="input-group-text bg-transparent"><i class="bi bi-lock text-muted"></i></span>
                      <input type="password" class="form-control" id="regPass" placeholder="Min 6 characters" minlength="6" required>
                      <button type="button" class="btn btn-outline-brand password-toggle" data-target="regPass" aria-label="Show password"><i class="bi bi-eye"></i></button>
                    </div>
                    <div class="error-msg"></div>
                  </div>
                  <div class="col-md-6 form-field">
                    <label for="regPass2" class="form-label">Confirm Password</label>
                    <div class="input-group">
                      <span class="input-group-text bg-transparent"><i class="bi bi-shield-lock text-muted"></i></span>
                      <input type="password" class="form-control" id="regPass2" placeholder="Repeat password" minlength="6" data-match="regPass" required>
                    </div>
                    <div class="error-msg"></div>
                  </div>
                  <div class="col-12 form-field">
                    <div class="form-check">
                      <input type="checkbox" class="form-check-input" id="regTerms" required>
                      <label class="form-check-label small" for="regTerms">I agree to the <a href="terms.html" class="text-brand fw-bold">Terms of Service</a> and <a href="privacy-policy.html" class="text-brand fw-bold">Privacy Policy</a>.</label>
                    </div>
                    <div class="error-msg"></div>
                  </div>
                </div>
                <button type="submit" class="btn btn-brand w-100 btn-lg mt-4 mb-3"><i class="bi bi-person-plus me-1"></i>Create Account</button>

                <div class="divider-or"><span>or sign up with</span></div>
                <div class="row g-2">
                  <div class="col-6">
                    <button type="button" class="btn btn-soft w-100"><i class="bi bi-google me-1" style="color:#ea4335"></i>Google</button>
                  </div>
                  <div class="col-6">
                    <button type="button" class="btn btn-soft w-100"><i class="bi bi-facebook me-1" style="color:#1877f2"></i>Facebook</button>
                  </div>
                </div>

                <p class="text-center small mt-4 mb-0">Already have an account? <a href="login.html" class="text-brand fw-bold">Sign in</a></p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var form = document.getElementById("registerForm");
      if (!form) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var email = document.getElementById("regEmail");
        var pass = document.getElementById("regPass");
        var pass2 = document.getElementById("regPass2");
        var terms = document.getElementById("regTerms");
        var fields = [document.getElementById("regName"), email, pass, pass2];
        var ok = true;
        fields.forEach(function (f) {
          var wrap = f.closest(".form-field");
          wrap.classList.remove("is-invalid");
          var msg = wrap.querySelector(".error-msg");
          if (!f.value.trim()) { msg.textContent = "This field is required."; wrap.classList.add("is-invalid"); ok = false; }
        });
        if (ok && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.value.trim())) {
          email.closest(".form-field").classList.add("is-invalid");
          email.closest(".form-field").querySelector(".error-msg").textContent = "Please enter a valid email address.";
          ok = false;
        }
        if (ok && pass.value.length < 6) {
          pass.closest(".form-field").classList.add("is-invalid");
          pass.closest(".form-field").querySelector(".error-msg").textContent = "Password must be at least 6 characters.";
          ok = false;
        }
        if (ok && pass.value !== pass2.value) {
          pass2.closest(".form-field").classList.add("is-invalid");
          pass2.closest(".form-field").querySelector(".error-msg").textContent = "Passwords do not match.";
          ok = false;
        }
        if (ok && !terms.checked) {
          terms.closest(".form-field").classList.add("is-invalid");
          terms.closest(".form-field").querySelector(".error-msg").textContent = "Please accept the terms to continue.";
          ok = false;
        }
        if (!ok) {
          showToast("Check the form", "Please fix the highlighted fields.", "error");
          return;
        }
        try {
          localStorage.setItem("lb-user", JSON.stringify({ name: document.getElementById("regName").value.trim(), email: email.value.trim() }));
        } catch (err) {}
        showToast("Account created!", "Welcome to the LittleBloom family (demo).", "ok");
        setTimeout(function () { window.location.href = "index.html"; }, 900);
      });
    });
  </script>
</body>
</html>
