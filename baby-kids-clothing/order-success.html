<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your order was placed successfully. Thank you for shopping at LittleBloom.">
  <meta name="keywords" content="order success, confirmation, thank you">
  <meta name="author" content="LittleBloom">
  <meta name="robots" content="noindex">
  <title>Order Confirmed — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Order Confirmed — LittleBloom">
  <meta property="og:description" content="Your order has been placed successfully.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="confetti-body">

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <!-- Navbar (injected by assets/js/navbar.js) -->
  <div id="navbar-container"></div>

  <main>

    <!-- ============ ORDER SUCCESS (rendered by main.js) ============ -->
    <section class="section">
      <div class="container">
        <div id="orderSuccess" aria-live="polite"></div>
      </div>
    </section>

    <!-- ============ NEWSLETTER ============ -->
    <section class="section bg-surface-2">
      <div class="container">
        <div class="newsletter-panel reveal">
          <div class="np-inner">
            <div class="np-emoji" aria-hidden="true">🎁</div>
            <span class="eyebrow" style="justify-content:center">Bloom Club</span>
            <h2 class="section-title mb-2">Earn Rewards on Every Order</h2>
            <p class="section-subtitle mx-auto">Join free and collect Bloom Points to unlock exclusive gifts.</p>
            <form class="newsletter-form" data-validate novalidate>
              <div class="input-group">
                <input type="email" class="form-control" placeholder="Enter your email address" aria-label="Email address" required>
                <button class="btn btn-brand px-4" type="submit">Join the Club</button>
              </div>
              <div class="form-text newsletter-msg"></div>
            </form>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer (injected by assets/js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
