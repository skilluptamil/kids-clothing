<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oops! The page you're looking for can't be found at LittleBloom.">
  <meta name="keywords" content="404, not found, error page">
  <meta name="author" content="LittleBloom">
  <meta name="robots" content="noindex">
  <title>Page Not Found — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Page Not Found — LittleBloom">
  <meta property="og:description" content="This page wandered off.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <!-- Navbar (injected by assets/js/navbar.js) -->
  <div id="navbar-container"></div>

  <main>
    <section class="section">
      <div class="container">
        <div class="error-404">
          <div class="error-emoji" aria-hidden="true">🧦</div>
          <div class="error-code">404</div>
          <h1 class="font-heading fw-bold">Oops — This Sock Got Lost</h1>
          <p class="text-muted mx-auto" style="max-width:460px">The page you're looking for has wandered off like a missing sock. Let's get you back to the good stuff.</p>
          <div class="d-flex gap-3 flex-wrap justify-content-center mt-2">
            <a href="index.html" class="btn btn-brand"><i class="bi bi-house me-1"></i>Back to Home</a>
            <a href="shop.html" class="btn btn-outline-brand"><i class="bi bi-bag me-1"></i>Browse the Shop</a>
          </div>
          <div class="mt-4 w-100" style="max-width:420px">
            <form action="search.html" method="get" role="search">
              <div class="input-group">
                <input type="search" name="q" class="form-control" placeholder="Search our collection…" aria-label="Search products">
                <button class="btn btn-brand px-3" type="submit"><i class="bi bi-search"></i></button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer (injected by assets/js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
