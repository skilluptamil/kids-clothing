<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LittleBloom is undergoing a quick refresh. We'll be back shortly.">
  <meta name="keywords" content="maintenance, down for maintenance">
  <meta name="author" content="LittleBloom">
  <title>Under Maintenance — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Under Maintenance — LittleBloom">
  <meta property="og:description" content="We'll be right back.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="launch-body">

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <main class="launch-main">
    <div class="launch-inner">
      <div class="launch-emoji" aria-hidden="true">🧸</div>
      <span class="pill mint mb-3"><i class="bi bi-tools me-1"></i>Quick Refresh</span>
      <h1 class="launch-title">We'll Be Right Back</h1>
      <p class="launch-sub">Our elves are polishing the shelves. The shop reopens in just a little while — keep the sleepyheads cozy in the meantime.</p>

      <!-- Countdown -->
      <div class="countdown justify-content-center mb-4" data-countdown="2026-08-15T12:00:00">
        <div class="cd-box"><span class="cd-num">0</span><span class="cd-label">Days</span></div>
        <div class="cd-box"><span class="cd-num">00</span><span class="cd-label">Hours</span></div>
        <div class="cd-box"><span class="cd-num">00</span><span class="cd-label">Minutes</span></div>
        <div class="cd-box"><span class="cd-num">00</span><span class="cd-label">Seconds</span></div>
      </div>

      <div class="launch-social">
        <a href="#" class="icon-btn" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" class="icon-btn" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
        <a href="#" class="icon-btn" aria-label="Pinterest"><i class="bi bi-pinterest"></i></a>
        <a href="#" class="icon-btn" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
      </div>

      <a href="index.html" class="btn btn-outline-brand btn-sm mt-3"><i class="bi bi-house me-1"></i>Back to Home</a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
