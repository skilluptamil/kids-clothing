<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your wishlist at LittleBloom — save favourite outfits for later and move them to your cart anytime.">
  <meta name="keywords" content="wishlist, favourites, kids clothing">
  <meta name="author" content="LittleBloom">
  <title>Your Wishlist — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Wishlist — LittleBloom">
  <meta property="og:description" content="Save favourite outfits for later.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <!-- Navbar (injected by assets/js/navbar.js) -->
  <div id="navbar-container"></div>

  <main>

    <!-- ============ PAGE BANNER ============ -->
    <section class="page-banner">
      <div class="container">
        <span class="eyebrow" style="justify-content:center">Favourites</span>
        <h1 class="display-5 font-heading fw-bold">My Wishlist</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center mb-0">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Wishlist</li>
          </ol>
        </nav>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <!-- Empty state -->
        <div id="wishlistEmpty" class="summary-card text-center py-5 d-none" style="position:static">
          <div class="empty-state">
            <div class="empty-emoji" aria-hidden="true">💖</div>
            <h4 class="fw-bold">Your wishlist is empty</h4>
            <p class="text-muted mb-4">Tap the heart on any product to save it here.</p>
            <a href="shop.html" class="btn btn-brand"><i class="bi bi-heart me-1"></i>Discover Favourites</a>
          </div>
        </div>

        <!-- Wishlist grid -->
        <div class="product-grid" id="wishlistGrid"></div>

        <div class="text-center mt-5">
          <a href="shop.html" class="btn btn-outline-brand"><i class="bi bi-arrow-left me-1"></i>Continue Shopping</a>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer (injected by assets/js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
