<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your LittleBloom password — we'll send you a secure link to get back into your account.">
  <meta name="keywords" content="forgot password, reset password, help">
  <meta name="author" content="LittleBloom">
  <title>Forgot Password — LittleBloom Kids Clothing</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Forgot Password — LittleBloom">
  <meta property="og:description" content="Reset your password.">
  <meta property="og:image" content="assets/images/logo/logo.svg">
  <meta property="og:site_name" content="LittleBloom">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 + Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" data-bs-css>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Template styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Restore saved theme & RTL before paint -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("lb-theme") || "light";
        document.documentElement.setAttribute("data-bs-theme", t);
        var r = localStorage.getItem("lb-rtl") === "1";
        document.documentElement.setAttribute("dir", r ? "rtl" : "ltr");
        if (r) {
          var l = document.querySelector("link[data-bs-css]");
          if (l) l.href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- Preloader -->
  <div class="preloader" id="preloader">
    <div class="spinner-brand"><img src="assets/images/logo/logo.svg" alt="" width="30" height="30"></div>
    <div class="brand-name">LittleBloom</div>
    <div class="loading-bar"><span></span></div>
  </div>

  <!-- Navbar (injected by assets/js/navbar.js) -->
  <div id="navbar-container"></div>

  <main>

    <!-- ============ RESET CARD ============ -->
    <section class="section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-5">
            <div class="summary-card auth-card" style="position:static">
              <div class="text-center mb-4">
                <a href="index.html" class="auth-brand-link d-inline-flex align-items-center gap-2 mb-3 text-decoration-none" aria-label="LittleBloom Home" title="Back to LittleBloom Home">
                  <span class="brand-logo-wrap">
                    <svg class="brand-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="42" height="42" aria-hidden="true">
                      <defs>
                        <linearGradient id="lbForgotLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FF9E80"/>
                          <stop offset="50%" stop-color="#FF6F61"/>
                          <stop offset="100%" stop-color="#F4511E"/>
                        </linearGradient>
                        <linearGradient id="lbForgotPetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FFFFFF"/>
                          <stop offset="100%" stop-color="#FFF3E0"/>
                        </linearGradient>
                        <linearGradient id="lbForgotCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#FFE082"/>
                          <stop offset="100%" stop-color="#FFB300"/>
                        </linearGradient>
                        <filter id="lbForgotLogoGlow" x="-10%" y="-10%" width="120%" height="120%">
                          <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#F4511E" flood-opacity="0.3"/>
                        </filter>
                      </defs>
                      <rect x="3" y="3" width="58" height="58" rx="18" ry="18" fill="url(#lbForgotLogoGrad)" filter="url(#lbForgotLogoGlow)"/>
                      <path d="M 6 22 C 6 12, 12 6, 22 6 L 42 6 C 28 10, 10 21, 6 42 Z" fill="#FFFFFF" opacity="0.18"/>
                      <g fill="url(#lbForgotPetalGrad)">
                        <ellipse cx="32" cy="21.5" rx="6.5" ry="8.5"/>
                        <ellipse cx="32" cy="42.5" rx="6.5" ry="8.5"/>
                        <ellipse cx="21.5" cy="32" rx="8.5" ry="6.5"/>
                        <ellipse cx="42.5" cy="32" rx="8.5" ry="6.5"/>
                        <ellipse cx="24.5" cy="24.5" rx="5.5" ry="7" transform="rotate(-45 24.5 24.5)" opacity="0.95"/>
                        <ellipse cx="39.5" cy="24.5" rx="5.5" ry="7" transform="rotate(45 39.5 24.5)" opacity="0.95"/>
                        <ellipse cx="24.5" cy="39.5" rx="5.5" ry="7" transform="rotate(45 24.5 39.5)" opacity="0.95"/>
                        <ellipse cx="39.5" cy="39.5" rx="5.5" ry="7" transform="rotate(-45 39.5 39.5)" opacity="0.95"/>
                      </g>
                      <circle cx="32" cy="32" r="8.5" fill="url(#lbForgotCenterGrad)"/>
                      <path d="M 32 35.8 C 32 35.8 28.2 33.3 28.2 31.1 C 28.2 29.6 29.4 28.6 30.7 28.6 C 31.4 28.6 31.8 28.9 32 29.3 C 32.2 28.9 32.6 28.6 33.3 28.6 C 34.6 28.6 35.8 29.6 35.8 31.1 C 35.8 33.3 32 35.8 32 35.8 Z" fill="#E64A19"/>
                      <path d="M 48 13 Q 48 17 52 17 Q 48 17 48 21 Q 48 17 44 17 Q 48 17 48 13 Z" fill="#FFFFFF" opacity="0.9"/>
                    </svg>
                  </span>
                  <span class="brand-name fs-4"><span class="brand-name-dark">Little</span><span class="brand-name-coral">Bloom</span></span>
                </a>
                <h2 class="font-heading fw-bold mb-1 fs-3">Forgot Your Password?</h2>
                <p class="text-muted small mb-0">Enter your email and we'll send you a secure password reset link.</p>
              </div>

              <form id="forgotForm" data-validate data-success="If an account exists, a reset link has been sent to your email." novalidate>
                <div class="form-field mb-3">
                  <label for="forgotEmail" class="form-label">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-transparent"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control" id="forgotEmail" placeholder="you@example.com" required>
                  </div>
                  <div class="error-msg"></div>
                </div>
                <div class="col-12">
                  <div class="form-msg mb-2"></div>
                </div>
                <button type="submit" class="btn btn-brand w-100 btn-lg mb-3"><i class="bi bi-send me-1"></i>Send Reset Link</button>
                <p class="text-center small mb-0">
                  Remembered it after all? <a href="login.html" class="text-brand fw-bold">Back to sign in</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer (injected by assets/js/footer.js) -->
  <div id="footer-container"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
